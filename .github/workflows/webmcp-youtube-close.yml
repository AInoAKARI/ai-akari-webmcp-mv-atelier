name: WebMCP YouTube closeout

on:
  push:
    paths:
      - '.github/workflows/webmcp-youtube-close.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger idempotent publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 360 \
            'https://rnudxlnsjqohzyvesvdx.supabase.co/functions/v1/webmcp-youtube-once-5b5c2130?run=lPeQ9g5PQeyhsBxuYnFzoHWAKpLICdP7'
