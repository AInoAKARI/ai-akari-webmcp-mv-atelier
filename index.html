<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIﾉアカリ☆ MV Atelier</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="eyebrow">AIﾉアカリ☆ / MV ATELIER</p><h1>You are me, I am you.</h1><p class="intro">Drop one doodle. A human and an agent can grow the same music-video project together.</p>
<section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span id="fileLabel">Choose a doodle image</span></label><img id="preview" class="preview" alt="Uploaded doodle preview" hidden><div id="metrics" class="metrics" hidden></div><div class="controls"><input id="title" value="Doodle MV" aria-label="MV title"><select id="mood" aria-label="Mood"><option value="dream">Dream</option><option value="uneasy">Uneasy</option><option value="anime">Anime</option></select><button id="create">Create 15s plan</button></div></section>
<section class="card"><h2 id="projectTitle">No project yet</h2><p id="analysis">Upload a doodle to begin.</p><div id="shots" class="shots"></div><div class="actions"><button id="save">Save project</button><button id="prepare">Prepare video</button></div><pre id="status" aria-live="polite"></pre></section>
<p class="foot">WebMCP tools are registered when supported by your browser. The same local project is used by the screen and agent.</p></main><script src="app.js"></script></body></html>
